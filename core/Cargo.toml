[package]
name = "parental-control-core"
version = "0.1.0"
edition = "2021"
description = "High-security zero-cost parental control engine with Ed25519 signing and offline SQLite policy enforcement"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "parental_control_core"

[dependencies]
# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
sha2 = "0.10"
rand = "0.8"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ureq = { version = "2.9", features = ["json"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# FFI Bindings
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3.10"
