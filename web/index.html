<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SafeShield">
    <title>SafeShield Parent (iOS Web App)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3B82F6;
            --danger: #EF4444;
            --success: #10B981;
            --text: #F8FAFC;
            --text-sub: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-lock {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
        }

        .btn-unlock {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }

        .btn-bonus {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            padding: 12px;
            font-size: 14px;
            border: 1px solid var(--card-border);
        }

        .bonus-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            font-size: 14px;
            color: #93C5FD;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-sub);
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .toast {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 30px);
            background: #1E293B;
            border: 1px solid var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <span style="font-size: 26px;">🛡️</span>
                <div>
                    <h1>SafeShield Parent</h1>
                    <p style="font-size: 12px; color: var(--text-sub);">iOS Controller App</p>
                </div>
            </div>
            <button onclick="toggleConfig()" style="background: transparent; color: var(--text-sub); font-size: 20px; padding: 6px;">⚙️</button>
        </div>

        <div id="statusBox" class="status-box">
            <span>●</span>
            <span id="statusText">Connected to Telegram Transport</span>
        </div>

        <!-- Quick Instant Controls -->
        <div class="card">
            <div class="card-title">Instant Device Control</div>
            <div class="btn-grid">
                <button class="btn-lock" onclick="sendLock()">
                    🔒 Lock Now
                </button>
                <button class="btn-unlock" onclick="sendUnlock()">
                    🔓 Unlock
                </button>
            </div>

            <div class="card-title" style="margin-top: 10px;">Grant Bonus Screen Time</div>
            <div class="bonus-grid">
                <button class="btn-bonus" onclick="sendBonus(15)">+15 min</button>
                <button class="btn-bonus" onclick="sendBonus(30)">+30 min</button>
                <button class="btn-bonus" onclick="sendBonus(60)">+1 hr</button>
            </div>
        </div>

        <!-- Bedtime Schedule -->
        <div class="card">
            <div class="card-title">Bedtime Schedule</div>
            <button class="btn-bonus" style="justify-content: space-between; padding: 14px;" onclick="sendBedtime()">
                <div style="text-align: left;">
                    <div style="font-weight: bold; color: white;">🌙 Apply Night Bedtime</div>
                    <div style="font-size: 12px; color: var(--text-sub);">21:30 → 06:00 (Everyday)</div>
                </div>
                <span>➔</span>
            </button>
        </div>

        <!-- Config Section (Collapsible) -->
        <div id="configSection" class="card" style="display: none;">
            <div class="card-title">Telegram Config</div>
            <div class="input-group">
                <label>Bot Token</label>
                <input type="text" id="botToken" value="8915785873:AAF7xDSUaQxpbcLIIcnlCx4D1kC628oBpqk">
            </div>
            <div class="input-group">
                <label>Chat ID</label>
                <input type="text" id="chatId" value="-5550682710">
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Command Sent!</div>

    <script>
        const DEFAULT_TOKEN = "8915785873:AAF7xDSUaQxpbcLIIcnlCx4D1kC628oBpqk";
        const DEFAULT_CHAT = "-5550682710";

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function toggleConfig() {
            const sec = document.getElementById('configSection');
            sec.style.display = sec.style.display === 'none' ? 'flex' : 'none';
        }

        async function dispatchTelegram(wireText, actionName) {
            const token = document.getElementById('botToken').value || DEFAULT_TOKEN;
            const chat = document.getElementById('chatId').value || DEFAULT_CHAT;

            document.getElementById('statusText').innerText = `Sending ${actionName}...`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chat,
                        text: wireText,
                        disable_notification: true
                    })
                });

                if (res.ok) {
                    showToast(`✓ ${actionName} Sent!`);
                    document.getElementById('statusText').innerText = `✓ ${actionName} Dispatched`;
                } else {
                    showToast(`Error sending`);
                }
            } catch (e) {
                showToast(`Failed: ${e.message}`);
            }
        }

        function sendLock() {
            const now = Math.floor(Date.now() / 1000);
            const raw = `CRT_CMD:{"payload":{"command_id":"${crypto.randomUUID()}","sender_pubkey":"ios_parent","target_device_id":"child_001","timestamp":${now},"expires_at":${now+60},"nonce":"${Math.random().toString(36).substring(2, 10)}","action":{"type":"LockNow","payload":{"duration_seconds":3600,"reason":"Locked from iOS"}}},"signature":"ios_sig"}`;
            dispatchTelegram(raw, "Lock Now");
        }

        function sendUnlock() {
            const now = Math.floor(Date.now() / 1000);
            const raw = `CRT_CMD:{"payload":{"command_id":"${crypto.randomUUID()}","sender_pubkey":"ios_parent","target_device_id":"child_001","timestamp":${now},"expires_at":${now+60},"nonce":"${Math.random().toString(36).substring(2, 10)}","action":{"type":"UnlockNow"}},"signature":"ios_sig"}`;
            dispatchTelegram(raw, "Unlock");
        }

        function sendBonus(mins) {
            const now = Math.floor(Date.now() / 1000);
            const raw = `CRT_CMD:{"payload":{"command_id":"${crypto.randomUUID()}","sender_pubkey":"ios_parent","target_device_id":"child_001","timestamp":${now},"expires_at":${now+60},"nonce":"${Math.random().toString(36).substring(2, 10)}","action":{"type":"GrantBonusTime","payload":{"package_name":null,"minutes":${mins}}}},"signature":"ios_sig"}`;
            dispatchTelegram(raw, `+${mins} min Bonus`);
        }

        function sendBedtime() {
            const now = Math.floor(Date.now() / 1000);
            const raw = `CRT_CMD:{"payload":{"command_id":"${crypto.randomUUID()}","sender_pubkey":"ios_parent","target_device_id":"child_001","timestamp":${now},"expires_at":${now+60},"nonce":"${Math.random().toString(36).substring(2, 10)}","action":{"type":"SetBedtimeSchedule","payload":{"schedule_id":"bedtime_01","name":"Night Bedtime","days_of_week":127,"start_time":"21:30","end_time":"06:00","mode":"LOCK_ALL"}}},"signature":"ios_sig"}`;
            dispatchTelegram(raw, "Bedtime Schedule");
        }
    </script>
</body>
</html>
